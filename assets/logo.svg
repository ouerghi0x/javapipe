<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>

    <!-- Java Warm Steam Gradient -->
    <linearGradient id="steamGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#EF4444" stop-opacity="1" />
    </linearGradient>

    <!-- Pipe Cyan / Electric Indigo Gradient -->
    <linearGradient id="pipeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="cupShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background Rounded Canvas -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)" />

  <!-- Outer Ambient Radial Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#pipeGrad)" stroke-width="2" opacity="0.25" stroke-dasharray="8 12" />

  <!-- Java Coffee Cup / Base Silhouette -->
  <g filter="url(#cupShadow)">
    <!-- Steam Curves (Functional Flow) -->
    <path d="M 210 135 C 195 105, 225 80, 210 50" fill="none" stroke="url(#steamGrad)" stroke-width="8" stroke-linecap="round" opacity="0.85" />
    <path d="M 245 130 C 230 95, 265 75, 245 45" fill="none" stroke="url(#steamGrad)" stroke-width="9" stroke-linecap="round" />
    <path d="M 280 135 C 265 105, 295 80, 280 55" fill="none" stroke="url(#steamGrad)" stroke-width="8" stroke-linecap="round" opacity="0.85" />

    <!-- Stylized Modern Cup Body -->
    <path d="M 140 160 L 330 160 C 330 250, 290 310, 235 310 C 180 310, 140 250, 140 160 Z" 
          fill="#1E293B" stroke="#334155" stroke-width="6" stroke-linejoin="round" />

    <!-- Cup Handle -->
    <path d="M 320 180 C 375 180, 375 250, 310 255" fill="none" stroke="#334155" stroke-width="8" stroke-linecap="round" />
    
    <!-- Cup Saucer Base -->
    <path d="M 170 330 L 300 330 C 315 330, 320 345, 305 345 L 165 345 C 150 345, 155 330, 170 330 Z" 
          fill="#0F172A" stroke="#334155" stroke-width="4" />
  </g>

  <!-- The Pipe Operator: |> Overlaying Dynamically -->
  <g filter="url(#cyanGlow)">
    <!-- Vertical Pipe: | -->
    <rect x="180" y="195" width="22" height="120" rx="11" fill="url(#pipeGrad)" />

    <!-- Chevron Forward Pipe: > -->
    <path d="M 230 195 L 295 255 L 230 315" 
          fill="none" 
          stroke="url(#pipeGrad)" 
          stroke-width="24" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
          
    <!-- Accent Pipeline Particle Sparks -->
    <circle cx="335" cy="255" r="7" fill="#38BDF8" />
    <circle cx="365" cy="255" r="4" fill="#818CF8" />
    <circle cx="385" cy="255" r="2.5" fill="#C084FC" />
  </g>

  <!-- Wordmark Tag -->
  <text x="256" y="440" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-size="34" 
        font-weight="800" 
        letter-spacing="6" 
        fill="#F8FAFC" 
        text-anchor="middle">JAVA PIPE</text>
  <text x="256" y="468" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="14" 
        font-weight="600" 
        letter-spacing="3" 
        fill="#38BDF8" 
        text-anchor="middle">FUNCTIONAL PIPELINES</text>
</svg>
